<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auri — Historias y fanfics</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Degradados de la mascota (se reutilizan con url(#auri-fur) / url(#auri-belly)) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="auri-fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cfa6fc"/><stop offset="1" stop-color="#8e61cf"/></linearGradient>
    <linearGradient id="auri-belly" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaff"/><stop offset="1" stop-color="#f0e6fa"/></linearGradient>
  </defs>
</svg>

<!-- Toda la interfaz se dibuja aquí desde app.js (SPA con rutas #/...) -->
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
