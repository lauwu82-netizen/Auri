# Publica solo la función de moderación con IA cada vez que cambia su código (no hay que pegar nada en Supabase)
name: Publicar función de IA
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase functions deploy moderate-chapter --project-ref gnhhxvqjtvchjmtizzua --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
